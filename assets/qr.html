<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QR · Reporta tu campus</title>
<!-- Fuente de qr-campus.png (1000x1000):
     msedge --headless --hide-scrollbars --window-size=1000,1000 --screenshot=qr-campus.png assets/qr.html -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* { margin: 0; }
html, body { width: 1000px; height: 1000px; background: #fff; overflow: hidden; }
#qr { position: absolute; left: 60px; top: 60px; }
#qr canvas, #qr img { display: block; width: 880px !important; height: 880px !important; }
</style>
</head>
<body>
<div id="qr"></div>
<script>
  new QRCode(document.getElementById("qr"), {
    text: "https://respondecuaak-dotcom.github.io/cuaak-responde/campus.html#reportar",
    width: 880, height: 880, colorDark: "#000000", colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M,
  });
</script>
</body>
</html>
