<nav class="menu" aria-label="Secciones">
  <a href="./">Horario</a>
  <a href="campus.html">Campus</a>
  <a href="admin.html" aria-current="page">Panel</a>

<div class="admin-wrap">
  <!-- ============ LOGIN ============ -->
  <section class="panel login" id="login" hidden>
    <div class="panel-head"><h2><span class="num">🔒</span> Panel del equipo</h2></div>
    <form id="f-login" class="filtros">
      <label class="campo ancho"><span>Correo</span><input id="l-correo" type="email" autocomplete="username" required></label>
      <label class="campo ancho"><span>Contraseña</span><input id="l-pass" type="password" autocomplete="current-password" required></label>
      <button class="btn add full ancho" type="submit" id="l-btn">Entrar</button>
    </form>
  </section>

  <!-- ============ PANEL ============ -->
  <section class="panel" id="panel" hidden>
    <div class="panel-head">
      <h2><span class="num">⚙</span> Reportes del campus</h2>
      <div class="adm-barra derecha"><span id="quien"></span><button class="btn sm ghost" id="salir" type="button">Salir</button></div>
    </div>
    <div class="estados" id="a-filtros" role="group" aria-label="Filtrar"></div>
    <label class="campo buscar-t"><input id="a-q" type="search" placeholder="Buscar por lugar, problema o #número…" aria-label="Buscar"></label>
    <div id="a-casos" class="casos"></div>
  </section>
</div>

<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="config.js?v=4"></script>

<script src="admin.js?v=4"></script>
</body>
